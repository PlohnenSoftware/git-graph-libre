sonar.projectKey=git-graph-libre
sonar.projectName=Git Graph Libre
sonar.projectVersion=1.9.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,esbuild.js,engine/native,docs/kb/housekeeping.mjs,docs/kb/graphify.mjs
sonar.tests=tests,engine/native
# Test inclusions also exclude these files from the main source scope.
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts,engine/native/**/tests/**/*.rs

# Include the native Rust crates while keeping generated build output out.
sonar.exclusions=out/**,dist/**,node_modules/**,coverage/**,.vscode-test/**,graphify-out/**,*.vsix,**/target/**,**/*.node

# The Rust workspace is nested below the scanner's project root.
sonar.rust.cargo.manifestPaths=engine/Cargo.toml

# Build tooling runs outside the extension and has no unit-test harness
sonar.coverage.exclusions=scripts/**,esbuild.js,engine/native/**/build.rs,engine/native/**/tests/oracle/**,docs/kb/housekeeping.mjs,docs/kb/graphify.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=src/tsconfig.json,src/webview/tsconfig.json,tests/tsconfig.json,tests/extension/tsconfig.json
