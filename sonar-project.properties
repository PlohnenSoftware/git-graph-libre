sonar.projectKey=git-graph-libre
sonar.projectName=Git Graph Libre
sonar.projectVersion=1.7.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,esbuild.js
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts

# engine/ is analyzed by the cargo gate (engine:check/test/lint/fmt), not by
# SonarQube. It already sits outside sonar.sources, so this is belt-and-braces:
# without it, broadening sonar.sources would pull engine/scripts/build-addon.mjs
# (spawnSync with shell:true) into analysis on an unrelated slice.
sonar.exclusions=out/**,dist/**,node_modules/**,coverage/**,.vscode-test/**,graphify-out/**,*.vsix,engine/**

# Build tooling runs outside the extension and has no unit-test harness
sonar.coverage.exclusions=scripts/**,esbuild.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=src/tsconfig.json,src/webview/tsconfig.json,tests/tsconfig.json,tests/extension/tsconfig.json
