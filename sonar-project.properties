sonar.projectKey=git-graph-libre
sonar.projectName=Git Graph Libre
sonar.projectVersion=1.4.2
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,esbuild.js
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts

sonar.exclusions=out/**,dist/**,node_modules/**,coverage/**,.vscode-test/**,graphify-out/**,*.vsix

# Build tooling runs outside the extension and has no unit-test harness
sonar.coverage.exclusions=scripts/**,esbuild.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=src/tsconfig.json,src/webview/tsconfig.json,tests/tsconfig.json,tests/extension/tsconfig.json
