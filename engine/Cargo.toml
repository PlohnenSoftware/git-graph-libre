[workspace]
resolver = "2"
members = ["native/core", "native/node", "native/diff"]

[workspace.package]
version = "1.0.30"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later AND MIT AND BSD-3-Clause"

[workspace.dependencies]
gix = { version = "0.90", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# gix and every gix-* crate come from the gitoxide monorepo at one pinned `main` commit, for the
# unreleased fixes the engine needs (replacement refs, the rename limit, Myers xdiff parity).
# Replace this with a crates.io release once one carries them.
[patch.crates-io]
gix = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "39e093fb541fc7a7acf6d7fef58f30827150cb00" }
