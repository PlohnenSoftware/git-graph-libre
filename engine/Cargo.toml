[workspace]
resolver = "2"
members = ["native/core", "native/node", "native/diff"]

[workspace.package]
version = "1.0.26"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later AND MIT"

[workspace.dependencies]
gix = { version = "0.89", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
