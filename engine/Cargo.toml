[workspace]
resolver = "2"
members = ["native/core", "native/node", "native/diff"]

[workspace.package]
version = "1.0.32"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later AND MIT AND BSD-3-Clause"

[workspace.dependencies]
gix = { git = "https://github.com/GitoxideLabs/gitoxide", branch = "main", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
