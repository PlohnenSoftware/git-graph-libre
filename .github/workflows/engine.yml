name: engine

# Rust gate for `engine/` (Phase 16, slice 16.1). These cargo checks complement
# SonarQube's Rust analysis; Biome's allowlist covers only the extension.
# They run only when the engine changed.

on:
  push:
    paths:
      - "tests/backend/vscodeDiff*.test.ts"
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "tests/backend/vscodeDiff*.test.ts"
      - "engine/**"
      - ".github/workflows/engine.yml"

jobs:
  gate:
    name: cargo check, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - run: corepack enable

      # `ubuntu-latest` ships a stable Rust toolchain, but clippy and rustfmt
      # are not guaranteed components — ensure both before running the gate.
      - name: Ensure clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: cargo check
        run: pnpm run engine:check

      - name: cargo test
        run: pnpm run engine:test

      - name: cargo clippy
        run: pnpm run engine:lint

      - name: cargo fmt
        run: pnpm run engine:fmt

  # Phase 17 (22h, 22i): the five-arm differential Vitest suite needs both of
  # our builds, the WebAssembly one and the native addon; without either it
  # skips every pair involving ours, so both are built and checked first.
  # `wasm-bindgen-cli` must match the `wasm-bindgen` crate exactly (the crate
  # pins it with `=` in engine/native/diff/Cargo.toml), so its version is read
  # from engine/Cargo.lock rather than repeated here: a Dependabot bump of the
  # crate then moves the CLI with it.
  diff-wasm:
    name: diff crate wasm build and differential suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (same version as the crate)
        run: |
          pkgid=$(cargo pkgid --manifest-path engine/Cargo.toml --locked wasm-bindgen)
          version=${pkgid##*[#@]}
          echo "wasm-bindgen ${version}, from engine/Cargo.lock"
          cargo install --locked wasm-bindgen-cli --version "${version}"

      - name: Build the diff crate for Node
        run: pnpm run diff:wasm

      - name: Check the build exists
        run: test -f engine/target/diff-wasm/git_graph_diff.js

      - name: Build the native addon
        run: pnpm run engine:build

      - name: Check the addon loads
        run: pnpm run engine:smoke

      - name: Differential suite
        run: pnpm exec vitest run --project backend tests/backend/vscodeDiffDifferential.test.ts tests/backend/vscodeDiffOracles.test.ts
