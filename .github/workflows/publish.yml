name: release

# `contents: write` is required to create the GitHub release and upload the VSIX.
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  native:
    name: Build engine binaries
    uses: ./.github/workflows/native-build.yml
    with:
      scope: full

  package:
    name: Package universal VSIX
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - run: corepack enable && pnpm install --frozen-lockfile

      # One VSIX carries every platform's engine and `vsce` is given no
      # `--target`, so a single artifact installs everywhere: the loader picks
      # its directory from `process.platform`/`process.arch` at runtime, and a
      # platform with no directory of its own (musl/Alpine above all) finds
      # nothing and runs on the `git` CLI, exactly as it would have with no
      # engine at all. The cost is deliberate — every install carries five
      # binaries it cannot load — and buys one file to download instead of
      # seven.
      - name: Download engine binaries
        uses: actions/download-artifact@v4.0.0
        with:
          pattern: native-*
          path: staging/

      # `download-artifact` names each directory after its artifact, so the
      # `native-` prefix comes off before the binaries land where
      # `.vscodeignore` whitelists them and the loader looks for them.
      - name: Stage every platform binary
        run: |
          shopt -s nullglob
          staged=0
          for dir in staging/native-*/; do
            platform="$(basename "$dir")"
            platform="${platform#native-}"
            mkdir -p "engine/native/$platform"
            mv "$dir"*.node "engine/native/$platform/"
            staged=$((staged + 1))
          done
          # A missing binary would package silently and leave that platform on
          # the CLI with nothing to say why, so the count is asserted rather
          # than trusted.
          if [ "$staged" -ne 6 ]; then
            echo "::error::expected 6 engine binaries, staged $staged"
            exit 1
          fi
          ls -l engine/native/*/*.node

      # `vsce package` runs `vscode:prepublish`, which typechecks, lints, and
      # builds the production bundle before writing the VSIX. It does not
      # rebuild the engine — the binaries staged above are what ships.
      - name: Package extension
        id: package
        run: |
          pnpm exec vsce package --no-dependencies
          vsix="$(ls -1 ./*.vsix | head -n 1)"
          if [ -z "$vsix" ]; then
            echo "::error::vsce package produced no .vsix file"
            exit 1
          fi
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "Packaged $vsix ($(du -h "$vsix" | cut -f1))"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4.0.0
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  release:
    name: Release and publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Download VSIX
        uses: actions/download-artifact@v4.0.0
        with:
          name: vsix
          path: dist/

      - name: Resolve the VSIX
        id: vsix
        run: |
          vsix="$(ls -1 dist/*.vsix | head -n 1)"
          if [ -z "$vsix" ]; then
            echo "::error::no .vsix was produced by the package job"
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes
          fi

      # The `secrets` context is not available to a step-level `if`, so resolve
      # each token into an output first and gate its publish step on that.
      - name: Check marketplace token
        id: marketplace
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if [ -n "$VS_MARKETPLACE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VS_MARKETPLACE_TOKEN is not set; skipping marketplace publish."
          fi

      - name: Check Open VSX token
        id: openvsx
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPEN_VSX_TOKEN is not set; skipping Open VSX publish."
          fi

      # Both publishes take the same artifact the GitHub release carries, with
      # `--skip-duplicate` so a re-run is a no-op rather than a failure.
      - name: Publish to VS Marketplace
        if: steps.marketplace.outputs.configured == 'true'
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: pnpm exec vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        if: steps.openvsx.outputs.configured == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: pnpm exec ovsx publish --packagePath "$VSIX" --skip-duplicate
