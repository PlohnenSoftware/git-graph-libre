name: native

# Builds the engine for all six shipped platforms on one Linux runner, by
# running `engine/scripts/build-all.mjs` — the same script and the same
# pinned toolchain a maintainer runs locally. That is the point: a release
# must not depend on this CI provider still existing, still offering these
# runners, or still offering them free, so the only build path is one that
# works anywhere a Linux box and a Rust toolchain do.
#
# Linux and macOS targets link through cargo-zigbuild, Windows targets through
# cargo-xwin; both install themselves on first use. zig is pinned by the
# script rather than taken from the runner image, because zig 0.16 breaks the
# macOS link (see the constant's comment there).

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build all six engine binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - run: corepack enable

      - name: Build every platform
        run: node engine/scripts/build-all.mjs

      - name: Report what was built
        run: |
          ls -l engine/native/*/git-graph.node
          sha256sum engine/native/*/git-graph.node

      # One artifact carrying all six platform directories, so the packaging
      # job restores them in one step and the layout it gets is the layout
      # `.vscodeignore` whitelists and the loader reads.
      - name: Upload engine binaries
        uses: actions/upload-artifact@v4.0.0
        with:
          name: native-all
          path: engine/native/*/git-graph.node
          if-no-files-found: error
