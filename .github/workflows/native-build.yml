name: native

# Builds the engine for all six shipped platforms on one Linux runner, by
# running `engine/scripts/build-all.mjs` — the same script and the same
# pinned toolchain a maintainer runs locally. That is the point: a release
# must not depend on this CI provider still existing, still offering these
# runners, or still offering them free, so the only build path is one that
# works anywhere a Linux box and a Rust toolchain do.
#
# Linux and macOS targets link through cargo-zigbuild, Windows targets through
# cargo-xwin; both install themselves on first use. zig is pinned by the
# script rather than taken from the runner image, because zig 0.16 breaks the
# macOS link (see the constant's comment there).

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build every engine binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # `build-addon.mjs` delegates the cargo plumbing to `@napi-rs/cli`, a
      # devDependency, so the install is not optional here the way it is for a
      # pure `cargo` job.
      - run: corepack enable && pnpm install --frozen-lockfile

      # Three caches, because the run populates three unrelated things and the
      # first one is by far the largest. Every key carries the toolchain pin,
      # so raising `rust-toolchain.toml` starts clean rather than mixing
      # artifacts from two compilers.

      # ~1.2 GB: the MSVC CRT and Windows SDK cargo-xwin downloads for the two
      # Windows targets. Fixed content, so the key only has to change when the
      # build script that drives it does.
      - name: Cache the MSVC CRT
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-${{ hashFiles('engine/scripts/build-addon.mjs') }}
          restore-keys: xwin-${{ runner.os }}-

      # ~350 MB: the pinned zig. Keyed on the script that names the version,
      # so a new pin fetches a new wheel instead of reusing the old one.
      - name: Cache the pinned zig
        uses: actions/cache@v4.2.0
        with:
          path: engine/.toolchain
          key: zig-${{ runner.os }}-${{ hashFiles('engine/scripts/build-all.mjs') }}

      # The compiled dependencies, eight targets' worth. `Swatinem/rust-cache`
      # keys on the lockfile and the rustc version itself and prunes the
      # workspace's own artifacts, which is what keeps this from growing past
      # the repository cache budget.
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2.8.0
        with:
          workspaces: engine
          key: native-all

      - name: Build every platform
        run: node engine/scripts/build-all.mjs

      - name: Report what was built
        run: |
          ls -l engine/native/*/git-graph.node
          sha256sum engine/native/*/git-graph.node

      # One artifact carrying all six platform directories, so the packaging
      # job restores them in one step and the layout it gets is the layout
      # `.vscodeignore` whitelists and the loader reads.
      - name: Upload engine binaries
        uses: actions/upload-artifact@v4.0.0
        with:
          name: native-all
          path: engine/native/*/git-graph.node
          if-no-files-found: error
